[package]
name = "yva"
version = "0.1.0"
edition = "2021"

license = "MIT OR Apache-2.0"
description = "Webassembly application to validate YAML, runs fully in a browser. Uses serde-saphyr"
keywords = ["yaml", "web", "webasm" ]

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.17", features = ["miette"] }
#serde-saphyr = { git = "https://github.com/bourumir-wyngs/serde-saphyr.git", features = ["miette"] }
miette = { version = "7.6", features = ["fancy-no-syscall"] }
ansi-to-html = "0.2.1"
serde_json = "1.0"
